name: Check merge candidates
on:
  workflow_dispatch:
  push:
    branches: ["codex/integration-*"]
permissions:
  contents: read
jobs:
  classify:
    name: Classify integration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      context_only: ${{ steps.classify.outputs.context_only }}
      base: ${{ steps.classify.outputs.base }}
      reference: ${{ steps.classify.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: classify
        run: python3 scripts/validate_context.py --branch "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/classification.json"
  context:
    name: Validate context records
    needs: classify
    if: needs.classify.outputs.context_only == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      GH_TOKEN: ${{ github.token }}
      EXPECTED_BASE: ${{ needs.classify.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-session-board/checker
            target
          key: context-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            candidate-x86_64-unknown-linux-gnu-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path scripts/checker/Cargo.toml
      - run: ./scripts/install-git-hooks
      - run: python3 scripts/validate_context.py --base "$EXPECTED_BASE" --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/CONTEXT.json"
      - uses: actions/upload-artifact@v4
        with:
          name: context-validation${{ github.run_attempt != '1' && format('-{0}', github.run_attempt) || '' }}
          path: ${{ runner.temp }}/CONTEXT.json
  linux:
    name: Candidate (linux-x86_64)
    needs: classify
    if: needs.classify.outputs.context_only == 'false'
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      EXPECTED_BASE: ${{ needs.classify.outputs.base }}
      EXPECTED_REFERENCE: ${{ needs.classify.outputs.reference }}
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      TARGET: x86_64-unknown-linux-gnu
      LABEL: linux-x86_64
    steps: &validate
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test repository candidate controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ref="repos/$GITHUB_REPOSITORY/git/ref/tags"
          if [[ "$LABEL" == macos-arm64 ]]; then
            until gh api "$ref/lab-allow-mac-validation-$GITHUB_SHA" --silent 2>/dev/null; do sleep 10; done
          else
            if gh api "$ref/lab-fail-linux-validation-$GITHUB_SHA" --silent 2>/dev/null; then exit 23; fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/validate --scope preflight --output "$RUNNER_TEMP/preflight"
      - run: python3 -m pip install -r requirements-delivery.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/codex-session-board/checker
            target
          key: candidate-${{ env.TARGET }}-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            candidate-${{ env.TARGET }}-1.99.1-${{ hashFiles('Cargo.lock') }}-
            candidate-${{ env.TARGET }}-1.99.1-
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path scripts/checker/Cargo.toml
      - run: ./scripts/install-git-hooks
      - run: TMPDIR=/tmp ./scripts/validate --integration-base "$EXPECTED_BASE" --output "$RUNNER_TEMP/validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ env.LABEL }}${{ github.run_attempt != '1' && format('-{0}', github.run_attempt) || '' }}
          path: ${{ runner.temp }}/validation/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ env.LABEL }}${{ github.run_attempt != '1' && format('-{0}', github.run_attempt) || '' }}
          path: |
            ${{ runner.temp }}/transfer-feedback/
            ${{ runner.temp }}/preflight/
  mac:
    name: Candidate (macos-arm64)
    needs: classify
    if: needs.classify.outputs.context_only == 'false'
    runs-on: macos-26
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      EXPECTED_BASE: ${{ needs.classify.outputs.base }}
      EXPECTED_REFERENCE: ${{ needs.classify.outputs.reference }}
      GIT_AUTHOR_NAME: Codex plugin publisher
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: Codex plugin publisher
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      TARGET: aarch64-apple-darwin
      LABEL: macos-arm64
    steps: *validate
  gate:
    name: Candidate gate
    if: always()
    needs: [classify, context, linux]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the complete validation path
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CONTEXT_ONLY: ${{ needs.classify.outputs.context_only }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          CANDIDATE_RESULT: ${{ needs.linux.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$CONTEXT_ONLY" = true ]; then
            test "$CONTEXT_RESULT" = success
            test "$CANDIDATE_RESULT" = skipped
          else
            test "$CONTEXT_ONLY" = false
            test "$CONTEXT_RESULT" = skipped
            test "$CANDIDATE_RESULT" = success
          fi
